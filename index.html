<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span>Wisdom Generator</span>
    </header>

    <main>
        <div class="card" id="remaining">
            <span>Remaining : </span>
            <p>5</p>
        </div>
        <div class="card" id="timer">
            <span>Reset in : </span>
            <p>01:00</p>
        </div>
        <div class="card" id="declined">
            <span>Declined : </span>
            <p>0</p>
        </div>
    </main>
    <div id="wisdom">
        <span>Click generate to get a piece of wisdom</span>
    </div>
    <button id="generate">
        Generate
    </button>

    <script src="/script.js"></script>
</body>
</html>
