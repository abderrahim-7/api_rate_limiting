<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span>Wisdom Generator</span>
    </header>

    <main>
        <div class="card" id="remaining">
            <span>Max Tokens : </span>
            <p>10</p>
        </div>
        <div class="card" id="timer">
            <span>Filing Rate : </span>
            <p>0.5req/s</p>
        </div>
        <div class="card" id="declined">
            <span>Totale wisdoms : </span>
            <p>30</p>
        </div>
    </main>
    <div id="wisdom">
        <span>Click generate to get a piece of wisdom</span>
    </div>
    <button id="generate">
        Generate
    </button>

    <script src="/script.js"></script>
</body>
</html>
